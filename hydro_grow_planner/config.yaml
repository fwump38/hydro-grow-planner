name: Hydro Grow Planner
version: "0.4.0"
slug: hydro_grow_planner
description: Plan hydroponic grows, run light and pump schedules, and track tasks and water readings.
url: https://github.com/fwump38/hydro-grow-planner
image: ghcr.io/fwump38/hydro-grow-planner
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:sprout
panel_title: Grow Planner
homeassistant_api: true
services:
  - mqtt:need
watchdog: http://[HOST]:[PORT:8099]/health
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
