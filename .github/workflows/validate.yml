name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Pytest
        run: .venv/bin/pytest

  frontend:
    name: Panel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: App image
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Version must match config.yaml on a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(grep -E '^version:' hydro_grow_planner/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')"
          test "$want" = "$have" || { echo "tag $want != config.yaml $have"; exit 1; }
      # The Supervisor pulls image:<version from config.yaml>, with no "v" prefix.
      - name: Image version
        id: version
        run: |
          version="$(grep -E '^version:' hydro_grow_planner/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')"
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish on a release tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hydro_grow_planner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/fwump38/hydro-grow-planner:${{ steps.version.outputs.value }}
            ghcr.io/fwump38/hydro-grow-planner:latest
